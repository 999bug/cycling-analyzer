compatibility_date = "2025-05-01"

# 允许的跨域来源（即你的站点域名 + 本地调试域名）。
# 如需自定义，取消下面 [vars] 注释并改成你的实际域名（逗号分隔）。
# [vars]
# ALLOWED_ORIGINS = "https://999bug.github.io,http://localhost:5173"
#
# 目标仓库（默认 999bug/cycling-analyzer）。
# REPO = "owner/repo"
