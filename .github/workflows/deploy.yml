# GitHub Pages 自动部署工作流
# 流程：git push → npm ci → lint → test → build → 发布 GitHub Pages
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 赋予 GitHub Pages 发布权限（官方 actions/deploy-pages 要求）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署运行，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建任务：安装依赖、静态检查、测试、产物构建
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 使用 Node 22：jsdom 30 依赖的 undici 8 需要 Node 22+ 的 webidl API，Node 20 下测试会报错
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # 作者数据快照：解析 author-data/fit/ 下的 FIT 文件生成 public/author-data/，
      # 必须在 Build 前执行（快照随 dist 一起发布）
      - name: Build author data
        run: npm run build:author-data

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 部署任务：等待构建完成后发布产物到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
